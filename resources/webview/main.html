<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brud</title>
  <link rel="stylesheet" href="{{styleUri}}">
</head>

<body>
  <textarea id="patchInput" placeholder="Paste <<<<<<< SEARCH / REPLACE blocks here..."></textarea>
  <div id="previewNav" style="display:none; margin-top: 10px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="prevFileBtn" title="Previous File">Prev</button>
      <span id="previewFileInfo" style="flex: 1; text-align: center; font-size: 12px;"></span>
      <button id="nextFileBtn" title="Next File">Next</button>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <button id="executeCurrentBtn" style="flex: 1;">Execute</button>
      <button id="executeAllBtn" style="flex: 1;">Execute All</button>
      <button id="previewAllBtn" style="flex: 1;">Preview All</button>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <button id="previewBtn">Preview Bulk Diff</button>
    <div style="display: flex; gap: 4px;">
      <button id="executeBtn" style="flex: 1;">Execute Patch</button>
      <button id="clearBtn" style="background: #333;">Clear</button>
    </div>
  </div>
  <div id="diagnostics"></div>
  <script src="{{scriptUri}}"></script>
</body>

</html>
