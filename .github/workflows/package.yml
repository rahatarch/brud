name: Extension Package Verification

on:
  push:
    branches: [main, 'feat/**', 'feature/**']
    paths:
      - 'apps/vscode/**'
      - 'packages/**'
      - '.vscodeignore'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/package.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/vscode/**'
      - 'packages/**'
      - '.vscodeignore'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/package.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run compile
      - run: npx @vscode/vsce package --no-git-tag-version