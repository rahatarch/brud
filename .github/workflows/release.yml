name: Release

# Tag-driven release. A human pushes an annotated tag (v<version>); this workflow
# verifies, builds and tests the tarballs once, smoke-tests them on three operating
# systems, WAITS FOR A HUMAN TO APPROVE, publishes those same tarballs to npm with
# provenance, checks the registry copy, and only then creates the GitHub Release.
# Run it by hand (workflow_dispatch) with a tag to rehearse everything except the
# publish: nothing is published or released from a manual run.
# Setup and recovery: docs/standards/releasing.md

on:
  push:
    tags: ['v[0-9]*']  # not 'v*': a participant named vault would be tagged vault@1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rehearse (for example v0.0.2). Nothing is published.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  CHECKOUT_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
      adopt: ${{ steps.meta.outputs.adopt }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (expected v1.2.3 or v1.2.3-beta.1)"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Fetch the annotated tag and main
        run: |
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --force
          git fetch origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release script tests
        run: npm run test:release
      - name: Verify versions, notes, tag and registry state
        id: meta
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          node scripts/release/verify.mjs --ci --tag "$TAG" --github-output "$GITHUB_OUTPUT"
      - name: Refuse if a GitHub Release already exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q false; then
            echo "::error::A published GitHub Release for $TAG already exists. Never reuse a tag; release a new version."; exit 1
          fi

  package:
    name: Build, test and pack
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build:protocol && npm run build:kernel && npm run build:sdk && npm run build:services && npm run build:daemon && npm run build:cli
      - name: Tests and checks
        run: |
          npm run test:kernel
          npm run test:sdk
          npm run test:daemon
          npm run test:cli
          npm run check:boundaries
          npx eslint packages/kernel packages/sdk packages/daemon packages/protocol
      - name: Pack the tarballs (once; these exact files are tested and published)
        if: needs.verify.outputs.adopt != 'true'
        run: node scripts/release/pack.mjs --out dist-release
      - name: Fetch the already-published tarballs (every package is on npm already)
        if: needs.verify.outputs.adopt == 'true'
        run: node scripts/release/pack.mjs --from-registry "${{ needs.verify.outputs.version }}" --out dist-release
      - name: Attest build provenance
        if: needs.verify.outputs.adopt != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-release/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: dist-release
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Smoke test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [verify, package]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: dist-release
      - name: Install the tarballs into an empty project and boot them
        run: node scripts/release/smoke.mjs --dir dist-release

  publish:
    name: Publish to npm (needs approval)
    if: github.event_name == 'push'
    needs: [verify, package, smoke]
    runs-on: ubuntu-latest
    # The `release` environment must require a reviewer: that approval is the human gate.
    environment:
      name: release
      url: https://www.npmjs.com/package/@brud/kernel
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          node -e "const [a,b,c]=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error('npm is too old for trusted publishing'); process.exit(1); } console.log('npm', a+'.'+b+'.'+c)"
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: dist-release
      - name: Publish the tested tarballs
        if: needs.verify.outputs.adopt != 'true'
        run: node scripts/release/publish.mjs --dir dist-release
      - name: Nothing to publish
        if: needs.verify.outputs.adopt == 'true'
        run: echo "Every package at this version is already on npm. Skipping publish; the GitHub Release will attach the registry copies."

  registry-check:
    name: Install from the registry
    needs: [verify, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: dist-release
      - name: Install @brud/*@${{ needs.verify.outputs.version }} from npm and boot it
        run: |
          for attempt in 1 2 3 4; do
            node scripts/release/smoke.mjs --dir dist-release --from-registry && exit 0
            echo "Attempt $attempt failed; the registry may still be catching up. Waiting 60 s."; sleep 60
          done
          exit 1

  github-release:
    name: Create the GitHub Release
    needs: [verify, package, registry-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: dist-release
      - name: Build the release body
        run: |
          node scripts/release/body.mjs --dir dist-release --tag "$TAG" --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" --previous "${{ needs.verify.outputs.previous_tag }}" --out release-body.md
      - name: Create the release as a draft, attach the assets, verify, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # A leftover draft from an earlier failed run is safe to replace; a published release is never touched.
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ] || { echo "::error::$TAG is already published"; exit 1; }
            gh release delete "$TAG" --yes
          fi
          flags=(--verify-tag --draft --title "BrudOS $VERSION" --notes-file release-body.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          assets=(dist-release/*.tgz dist-release/SHA256SUMS dist-release/release-manifest.json)
          gh release create "$TAG" "${flags[@]}" "${assets[@]}"
          want=${#assets[@]}
          have=$(gh release view "$TAG" --json assets --jq '.assets | length')
          [ "$have" = "$want" ] || { echo "::error::expected $want assets, found $have"; exit 1; }
          gh release edit "$TAG" --draft=false
          echo "Released $TAG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
