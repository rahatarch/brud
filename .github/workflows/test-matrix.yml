name: Cross-Platform Tests

on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'ci/**']
    paths:
      - 'packages/kernel/**'
      - 'packages/protocol/**'
      - 'packages/daemon/**'
      - 'packages/ui/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-matrix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/kernel/**'
      - 'packages/protocol/**'
      - 'packages/daemon/**'
      - 'packages/ui/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-matrix.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci

      - name: Build workspace packages
        run: npm run build:protocol && npm run build:kernel && npm run build:services

      - name: Kernel tests (blocking)
        run: npm run test:kernel

      - name: B0 goal tests (blocking)
        run: node --import tsx --test "packages/kernel/src/__tests__/goals/*.test.ts"

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Windows D-01 client process identity (production mirror)
        if: runner.os == 'Windows'
        run: node --import tsx --test packages/daemon/src/__verification__/windows_peer_identity.test.ts
