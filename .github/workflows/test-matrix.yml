name: Cross-Platform Tests

on:
  push:
    branches: [main, 'feat/**', 'feature/**']
    paths:
      - 'packages/core/**'
      - 'packages/utilities/**'
      - 'packages/automation/**'
      - 'packages/adapters/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-matrix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/utilities/**'
      - 'packages/automation/**'
      - 'packages/adapters/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-matrix.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build:protocol
      - run: npm run build:utilities
      - run: npm run build:core
      - run: npm run test:core
      - run: npm run test:integration