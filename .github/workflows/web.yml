name: Deploy Web to Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/web.yml

concurrency:
  group: deploy-production-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://brud.akkharlabs.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web static export
        run: npm run build:web
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Verify build artifacts
        run: test -d apps/web/out && ls -la apps/web/out/

      - name: Deploy static artifacts to VPS
        shell: bash
        run: |
          mkdir -p ~/.ssh
          eval "$(ssh-agent -s)"
          echo "${{ secrets.VPS_SSH_KEY }}" | ssh-add -
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          rsync -avz --delete apps/web/out/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_TARGET_DIR }}/

      - name: Post-deployment verification
        run: |
          curl -sSf -o /dev/null -w "HTTP Status: %{http_code}\n" \
            https://brud.akkharlabs.com